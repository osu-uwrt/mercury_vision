/**:
  ros__parameters:
    general:
      camera_model: zedxm
      serial_number: 53927609
      camera_name: "mercury/ffc"
      grab_resolution: 'SVGA'
      grab_frame_rate: 60
      pub_resolution: 'NATIVE'
      # pub_downscale_factor: 2.0 # rescale factor used to rescale image before publishing when 'pub_resolution' is 'CUSTOM'
      pub_frame_rate: 60.0
      async_image_retrieval: true
      # optional_opencv_calibration_file: "/home/ros/zed_cals/zedxmffc_calibration.yaml"
      self_calib: false
    depth:
      depth_mode: 'NONE'
    pos_tracking:
      pos_tracking_enabled: false
    video:
      publish_rgb: false
      publish_left_right: true
      publish_stereo: false   # needed for picture taker
      publish_raw: false      # only if you also want raw topics. needed for picture taker
      publish_gray: true   # apriltag depends on me
    debug:
      debug_common: false
      debug_point_cloud: false
      debug_video_depth: false
